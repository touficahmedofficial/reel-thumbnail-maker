const $=id=>document.getElementById(id);
const F=['ep','epw','ser','itl','hl','strike','stk','sub','acc','psz','pyo'];
const DEFAULTS={ep:'1',epw:'EPISODE',ser:'E-COMMERCE CRO SERIES',itl:'you don’t need',hl:'MORE TRAFFIC',strike:true,stk:'2X REVENUE',sub:'same traffic · same ad spend',acc:'#C8FF2E',psz:'100',pyo:'0'};
let photo=new Image(); photo.src=DEF_PHOTO;
function load(){try{const s=JSON.parse(localStorage.getItem('toufic_thumb')||'null');if(s)F.forEach(k=>{if(k in s){if(k==='strike')$(k).checked=s[k];else $(k).value=s[k];}});}catch(e){}}
function save(){try{const s={};F.forEach(k=>s[k]=k==='strike'?$(k).checked:$(k).value);localStorage.setItem('toufic_thumb',JSON.stringify(s));}catch(e){}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function rr(x,y,w,h,r,ctx){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function spaced(ctx,t,x,y,sp){ // centred letter-spaced text
  let w=0;for(const ch of t)w+=ctx.measureText(ch).width+sp;w-=sp;let cx=x-w/2;ctx.textAlign='left';
  for(const ch of t){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+sp;} ctx.textAlign='center';}
function bg(ctx,h){ctx.fillStyle='#0B0C0E';ctx.fillRect(0,0,1080,h);ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=1;
  for(let x=0;x<=1080;x+=90){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,h);ctx.stroke();}
  for(let y=0;y<=h;y+=90){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(1080,y+.5);ctx.stroke();}}
function draw(){
  const A=$('acc').value, c=$('c916'), ctx=c.getContext('2d'); save();
  bg(ctx,1920);
  const g=ctx.createRadialGradient(540,1220,0,540,1220,520);g.addColorStop(0,rgba(A,.22));g.addColorStop(1,rgba(A,0));ctx.fillStyle=g;ctx.fillRect(0,600,1080,1300);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  // badge
  const n=String($('ep').value||'').padStart(2,'0'); const bt=($('epw').value+' '+n).trim().toUpperCase();
  ctx.font='78px TAnton'; const bw=ctx.measureText(bt).width+72, bh=96, bx=540-bw/2, by=305;
  ctx.save();ctx.shadowColor=rgba(A,.55);ctx.shadowBlur=50;ctx.fillStyle=A;rr(bx,by,bw,bh,18,ctx);ctx.fill();ctx.restore();
  ctx.strokeStyle=rgba(A,.18);ctx.lineWidth=12;rr(bx-6,by-6,bw+12,bh+12,22,ctx);ctx.stroke();
  ctx.fillStyle='#0A0B0D';ctx.fillText(bt,540,by+80);
  ctx.font='500 24px TMono';ctx.fillStyle='#C9CDD4';spaced(ctx,$('ser').value.toUpperCase(),540,by+bh+44,7);
  // italic line
  ctx.font='italic 104px TInst';ctx.fillStyle='#fff';ctx.fillText($('itl').value,540,590);
  // headline
  const lines=$('hl').value.toUpperCase().split(/\||\n/).map(s=>s.trim()).filter(Boolean);
  let fs=172; ctx.font=fs+'px TAnton'; const mw=Math.max(...lines.map(l=>ctx.measureText(l).width),1);
  fs=Math.min(172,Math.floor(172*960/mw)); if(lines.length>1)fs=Math.min(fs,150); ctx.font=fs+'px TAnton';
  const lh=fs*1.08; let y0=604+fs*0.92;
  lines.forEach((l,i)=>{const y=y0+i*lh; ctx.fillStyle='#fff';ctx.fillText(l,540,y);
    if($('strike').checked){const w=ctx.measureText(l).width*1.06;ctx.save();ctx.translate(540,y-fs*.36);ctx.rotate(-3*Math.PI/180);ctx.shadowColor=rgba(A,.7);ctx.shadowBlur=30;ctx.fillStyle=A;ctx.fillRect(-w/2,-11,w,22);ctx.restore();}});
  const hlBottom=y0+(lines.length-1)*lh;
  // photo (fade at bottom)
  if(photo.complete&&photo.naturalWidth){const s=$('psz').value/100,pw=780*s,ph=pw*photo.naturalHeight/photo.naturalWidth;
    const px=540-pw/2, py=Math.max(hlBottom+50,840)+ +$('pyo').value;
    const o=document.createElement('canvas');o.width=pw;o.height=ph;const oc=o.getContext('2d');oc.drawImage(photo,0,0,pw,ph);
    oc.globalCompositeOperation='destination-in';const m=oc.createLinearGradient(0,0,0,ph);m.addColorStop(0,'#000');m.addColorStop(.70,'#000');m.addColorStop(.95,'rgba(0,0,0,0)');oc.fillStyle=m;oc.fillRect(0,0,pw,ph);
    ctx.drawImage(o,px,py);}
  // sticker
  const st=$('stk').value.toUpperCase();
  if(st){ctx.font='120px TAnton';const sw=ctx.measureText(st).width+92,sh=150;ctx.save();ctx.translate(540,1480+sh/2);ctx.rotate(-3*Math.PI/180);
    ctx.shadowColor=rgba(A,.45);ctx.shadowBlur=60;ctx.fillStyle=A;rr(-sw/2,-sh/2,sw,sh,24,ctx);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0A0B0D';ctx.fillText(st,0,48);ctx.restore();}
  // bottom line
  if($('sub').value){ctx.font='800 40px TMont';ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=18;ctx.shadowOffsetY=4;ctx.fillStyle='#fff';ctx.fillText($('sub').value,540,1732);ctx.restore();}
  // 4:5
  const d=$('c45'),dx=d.getContext('2d');bg(dx,1350);dx.drawImage(c,0,255,1080,1500,54,0,972,1350);
}
function dl(cv,name){cv.toBlob(async b=>{try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:b});return;}}}catch(e){if(e&&/declin|cancel|reject/i.test(String(e.message||e)))return;}
  const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(b);document.body.appendChild(a);a.click();a.remove();},'image/jpeg',.95);}
function fname(){return 'thumbnail_ep'+String($('ep').value||'').padStart(2,'0');}
F.forEach(k=>$(k).addEventListener('input',draw));
$('ph').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=new Image();photo.onload=draw;photo.src=r.result;};r.readAsDataURL(f);});
$('d916').onclick=()=>dl($('c916'),fname()+'_9x16.jpg');$('d45').onclick=()=>dl($('c45'),fname()+'_4x5.jpg');
$('reset').onclick=()=>{F.forEach(k=>{if(k==='strike')$(k).checked=DEFAULTS[k];else $(k).value=DEFAULTS[k];});photo=new Image();photo.onload=draw;photo.src=DEF_PHOTO;draw();};
load(); photo.onload=draw;
Promise.all(['78px TAnton','800 40px TMont','italic 104px TInst','500 24px TMono'].map(f=>document.fonts.load(f))).then(draw).catch(draw);
</script></body></html>
